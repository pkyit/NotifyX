server:
  port: 18081
  shutdown: graceful

spring:
  application:
    name: notifyx-consumer
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:127.0.0.1:19092}
    consumer:
      group-id: notifyx-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

notifyx:
  enabled: true
  mode: local
  env: consumer
  async:
    enabled: false          # 单消费者按分区顺序同步处理，避免异步重排
  channels:
    log:
      enabled: true
  scenes:
    SCENE_LIVE:
      level: ERROR
      channels: [log]
      silent-window: 0s
    ORDER_CREATE_FAIL:
      level: ERROR
      channels: [log]
      silent-window: 0s
  consumer:
    transport: kafka           # kafka | rabbitmq
    topic: ${NOTIFYX_TOPIC:notifyx-events}
    rabbitmq:
      queue: ${NOTIFYX_RABBITMQ_QUEUE:notifyx-events}
    idempotency-store: memory   # memory | redis | jdbc
    idempotency-ttl: 24h
    max-entries: 100000
    jdbc-url: ${NOTIFYX_JDBC_URL:}
    jdbc-user: ${NOTIFYX_JDBC_USER:}
    jdbc-password: ${NOTIFYX_JDBC_PASSWORD:}
