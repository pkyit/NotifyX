# 示例：不要提交真实凭据。实际创建用命令（见 README）：
# kubectl -n notifyx-demo create secret generic notifyx-smtp \
#   --from-literal=user='<邮箱>' --from-literal=pass='<授权码>'
apiVersion: v1
kind: Secret
metadata:
  name: notifyx-smtp
  namespace: notifyx-demo
type: Opaque
stringData:
  user: "CHANGE_ME@example.com"
  pass: "CHANGE_ME"
