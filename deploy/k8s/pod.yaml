apiVersion: v1
kind: Pod
metadata:
  name: notifyx-sample
  namespace: notifyx-demo
  labels:
    app.kubernetes.io/name: notifyx-sample
spec:
  containers:
    - name: app
      # 公开的阿里云 JDK17 镜像（国内可拉取）；生产建议把 fat jar 打进自有镜像
      image: registry.aliyuncs.com/pkyit/java:jdk17-font
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: NOTIFYX_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: notifyx-smtp
              key: user
        - name: NOTIFYX_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: notifyx-smtp
              key: pass
      ports:
        - name: http
          containerPort: 8080
      volumeMounts:
        - name: config
          mountPath: /config
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  volumes:
    - name: config
      configMap:
        name: notifyx-sample-config
